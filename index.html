<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ephemeral Chat</title>
  <link rel="stylesheet" href="ephemeral-chat-style.css">
</head>
<body>
  <main>
    <h1>Ephemeral 1:1 Chat</h1>
    <div id="login" class="card">
      <input id="nick" placeholder="Enter a nickname" />
      <button id="connect">Connect & Find Partner</button>
      <p class="note">Chats are ephemeral and deleted when the session ends.</p>
    </div>

    <div id="chat" class="card hidden">
      <div id="roomInfo"></div>
      <div id="messages" class="messages"></div>
      <form id="msgForm">
        <input id="msgInput" autocomplete="off" placeholder="Type a message..." />
        <button>Send</button>
      </form>
      <button id="disconnect" class="danger">Leave</button>
    </div>
  </main>
  <script type="module" src="ephemeral-chat-main.js"></script>
</body>
</html>
